[package]
name = "flintcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A high-performance Minecraft Beta 1.7.3 server core written in Rust."
license = "GPL-3.0-or-later"

[dependencies]
indexmap = "2"
libdeflater = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "macros",
] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
