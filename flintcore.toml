schema_version = 1

[server]
bind = "0.0.0.0"
port = 25565
max_players = 20
motd = "flintcore Beta 1.7.3"
online_mode = false

[network]
tcp_nodelay = true
inbound_capacity = 4096
outbound_capacity = 1024
max_read_buffer = 1048576
max_packets_per_tick = 2048

[world]
seed = 0
# The seed of the random of the world (`World.random`).
# "fixed" — the seed 0: the world is reproducible (the default).
# "fixed:<n>" — an explicit seed.
# "clock" — the system clock, exactly like the reference (`new Random()`):
#           the world is not reproducible between two runs.
random_seed = "fixed"
view_distance = 10
chunks_per_tick = 16
gen_workers = 0
compression_workers = 0
spawn_x = 0
spawn_y = 64
spawn_z = 0
